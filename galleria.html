    <script>
        // JavaScript for hide on scroll header AND transparent background toggle
        let lastScrollY = 0;
        const header = document.querySelector('header');
        const headerHeight = header.offsetHeight; 

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            // 1. Logic for Hiding/Showing the header (Roll up)
            if (currentScrollY > lastScrollY && currentScrollY > 10) {
                // Scrolling down and past header height -> Hide
                header.classList.add('hidden');
            } else {
                // Scrolling up -> Show
                header.classList.remove('hidden');
            }

            // 2. Logic for Scrolled Background (Transparency toggle)
            if (currentScrollY > 50) {
                // If scrolled down more than 50px, add 'scrolled' class (makes bg white)
                header.classList.add('scrolled');
            } else {
                // If at top, remove 'scrolled' class (makes bg transparent if on home)
                header.classList.remove('scrolled');
            }

            lastScrollY = currentScrollY;
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); // Optional: animate only once
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-section').forEach((section) => {
            observer.observe(section);
        });

        document.addEventListener("DOMContentLoaded", () => {
            const galleryImages = document.querySelectorAll('.gallery-img');

            galleryImages.forEach(img => {
                img.addEventListener('click', function() {
                    this.classList.toggle('enlarged');
                });
            });
        });
    </script>
