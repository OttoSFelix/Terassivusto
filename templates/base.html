<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>{% block title %}Urbaanipihat{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="{% block header_class %}{% endblock %}">
        <div class="container header-content">
            <div class="logo">
                <a href="/etusivu" class="otsikko"><img src="{{ url_for('static', filename='images/Urbaanipihat_logo.png') }}" alt="Logo" class="logo-font"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="/etusivu" class="{% if request.endpoint == 'etusivu' %}active{% endif %}">Etusivu</a></li>
                    <li><a href="/yhteystiedot" class="{% if request.endpoint == 'yhteystiedot' %}active{% endif %}">Ota yhteyttä</a></li>
                    <li><a href="/hinnasto" class="{% if request.endpoint == 'hinnasto' %}active{% endif %}">Hinnasto ja palvelualue</a></li>
                    <li><a href="/info" class="{% if request.endpoint == 'info' %}active{% endif %}">Tietoa meistä</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Urbaanipihat. Kaikki oikeudet pidätetään.</p>
        </div>
    </footer>
    <script>
        // JavaScript for hide on scroll header AND transparent background toggle
        let lastScrollY = 0;
        const header = document.querySelector('header');
        const headerHeight = header.offsetHeight; 

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            // 1. Logic for Hiding/Showing the header (Roll up)
            if (currentScrollY > lastScrollY && currentScrollY > 10) {
                // Scrolling down and past header height -> Hide
                header.classList.add('hidden');
            } else {
                // Scrolling up -> Show
                header.classList.remove('hidden');
            }

            // 2. Logic for Scrolled Background (Transparency toggle)
            if (currentScrollY > 500) {
                // If scrolled down more than 50px, add 'scrolled' class (makes bg white)
                header.classList.add('scrolled');
            } else {
                // If at top, remove 'scrolled' class (makes bg transparent if on home)
                header.classList.remove('scrolled');
            }

            lastScrollY = currentScrollY;
        });
    </script>
</body>
</html>
